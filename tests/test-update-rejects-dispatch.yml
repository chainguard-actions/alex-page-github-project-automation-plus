name: Test update action rejects unsupported event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under act, github.context.eventName is always workflow_dispatch, which this
      # action does not accept (only PR/issue/review/comment events). It must fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          project: Backlog
          column: To do
      - name: Assert action failed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for workflow_dispatch event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
