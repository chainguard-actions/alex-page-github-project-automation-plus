name: Test GITHUB_EVENT_NAME env override is not trusted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action reads github.context (computed from the event payload), so
      # setting GITHUB_EVENT_NAME at step level must not let it proceed with
      # a missing issue/pull_request payload.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          project: Backlog
          column: In progress
          action: add
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
